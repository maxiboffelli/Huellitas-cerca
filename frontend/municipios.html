<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Municipios Adheridos - Huellitas Cerca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="js/config.js"></script>
    <script>tailwind.config = TAILWIND_BRAND_CONFIG;</script>
</head>
<body class="bg-brand-bg text-brand-textDark font-sans min-h-screen">

    <header id="app-header" class="bg-brand-bg border-b border-brand-tagBg sticky top-0 z-50"></header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        <div class="bg-brand-card rounded-card p-8 border border-brand-tagBg">
            <span class="text-xs font-bold tracking-widest text-brand-accent uppercase">Licencias SaaS B2B</span>
            <h1 class="text-3xl font-serif font-bold text-brand-textDark mt-1">Municipalidades de Buenos Aires Adheridas</h1>
            <p class="text-sm text-brand-textMuted mt-2 max-w-3xl">
                Gobiernos locales que utilizan nuestra plataforma para centralizar el control de zoonosis, transparencia en adopciones y gestión de animales en la vía pública.
            </p>
        </div>

        <div id="grid-municipios" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            renderNavbar("municipios");
            const grid = document.getElementById("grid-municipios");
            try {
                const munis = await apiFetch("/municipios");
                grid.innerHTML = munis.map(m => `
                    <div class="bg-brand-card rounded-card p-6 border border-brand-tagBg space-y-4">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="px-3 py-1 rounded-pill bg-brand-greenBadge text-white text-[10px] font-bold uppercase">Licencia SaaS Activa</span>
                                <h2 class="font-serif font-bold text-2xl text-brand-textDark mt-2">${m.nombre}</h2>
                                <p class="text-xs font-semibold text-brand-primary">${m.area_responsable}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4 bg-brand-bg p-4 rounded-card border border-brand-tagBg text-center">
                            <div>
                                <span class="block text-2xl font-serif font-bold text-brand-greenBadge">${m.metricas?.adopciones_logradas || 0}</span>
                                <span class="text-[11px] text-brand-textMuted font-semibold">Adopciones</span>
                            </div>
                            <div>
                                <span class="block text-2xl font-serif font-bold text-brand-accent">${m.metricas?.castraciones_realizadas || 0}</span>
                                <span class="text-[11px] text-brand-textMuted font-semibold">Castraciones</span>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-3 pt-2">
                            <a href="catalogo.html?partido=${encodeURIComponent(m.partido)}" class="px-5 py-2.5 bg-brand-primary text-white rounded-pill text-xs font-semibold">
                                Ver animales de ${m.partido} &rarr;
                            </a>
                            <a href="https://wa.me/${m.whatsapp_institucional}" target="_blank" class="px-5 py-2.5 border border-brand-tagBg text-brand-textDark rounded-pill text-xs font-semibold">
                                WhatsApp Zoonosis
                            </a>
                        </div>
                    </div>
                `).join("");
            } catch (err) {
                grid.innerHTML = `<p class="text-sm text-red-600">Error: ${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
