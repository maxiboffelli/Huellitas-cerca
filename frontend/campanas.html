<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campañas Municipales - Código Pescar</title>
    <link rel="icon" type="image/png" href="assets/pata.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="js/config.js"></script>
    <script>tailwind.config = TAILWIND_BRAND_CONFIG;</script>
</head>
<body class="bg-brand-bg text-brand-textDark font-sans min-h-screen">

    <header id="app-header" class="bg-brand-bg border-b border-brand-tagBg sticky top-0 z-50"></header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        <div class="bg-brand-card rounded-card p-8 border border-brand-tagBg flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <span class="text-xs font-bold tracking-widest text-brand-greenBadge uppercase">Salud Pública y Zoonosis</span>
                <h1 class="text-3xl font-serif font-bold text-brand-textDark mt-1">Campañas Oficiales de Vacunación y Castración</h1>
                <p class="text-sm text-brand-textMuted mt-2">Consultá los operativos gratuitos vigentes en tu partido de la Provincia de Buenos Aires.</p>
            </div>
            <div class="w-full md:w-72">
                <label class="block text-xs font-bold text-brand-textMuted uppercase mb-2">Filtrar por Partido</label>
                <select id="campana-partido" class="w-full px-4 py-3 bg-white border border-brand-tagBg rounded-pill text-sm"></select>
            </div>
        </div>

        <div id="grid-campanas" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>

    <script src="js/api.js"></script>
    <script>
        async function cargarCampanas() {
            const partido = document.getElementById("campana-partido").value;
            const query = partido ? `?partido=${encodeURIComponent(partido)}` : "";
            const grid = document.getElementById("grid-campanas");
            try {
                const items = await apiFetch(`/campanas${query}`);
                if (items.length === 0) {
                    grid.innerHTML = `<div class="col-span-full bg-brand-card p-8 rounded-card border border-brand-tagBg text-center text-sm text-brand-textMuted">No hay campañas cargadas para este partido todavía.</div>`;
                    return;
                }
                grid.innerHTML = items.map(c => {
                    const turnoHTML = c.requiere_turno
                        ? `
                            <div class="bg-brand-greenBadge/10 border border-brand-greenBadge/30 rounded-card px-4 py-3 space-y-1.5">
                                <p class="text-xs font-bold text-brand-greenBadge uppercase"><i class="fa-solid fa-calendar-check mr-1.5"></i>Requiere Turno Previo</p>
                                ${c.contacto_turno ? `<p class="text-xs text-brand-textDark"><i class="fa-solid fa-phone mr-1.5 text-brand-textMuted"></i>Contacto: <strong>${c.contacto_turno}</strong></p>` : ""}
                                ${c.link_turnos ? `<a href="${c.link_turnos}" target="_blank" class="inline-block text-xs font-bold text-brand-accent hover:underline"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>Sacar turno online</a>` : ""}
                            </div>`
                        : `<div class="bg-brand-tagBg/60 rounded-card px-4 py-2.5">
                                <p class="text-xs font-semibold text-brand-primary"><i class="fa-solid fa-clock mr-1.5"></i>Por orden de llegada — Sin turno previo</p>
                           </div>`;

                    const linkOficialHTML = c.link_oficial
                        ? `<a href="${c.link_oficial}" target="_blank" class="inline-flex items-center gap-1.5 text-xs font-bold text-brand-primary hover:text-brand-accent">
                              <i class="fa-solid fa-globe"></i> Sitio oficial del operativo
                           </a>`
                        : "";

                    return `
                        <div class="bg-brand-card rounded-card p-6 border border-brand-tagBg space-y-4">
                            <div class="flex justify-between items-center gap-2">
                                <span class="px-3 py-1 rounded-pill bg-brand-greenBadge text-white text-[11px] font-bold uppercase">${c.partido}</span>
                                <span class="text-xs font-bold text-brand-accent">${c.fecha_inicio} al ${c.fecha_fin}</span>
                            </div>
                            <h2 class="font-serif font-bold text-2xl text-brand-textDark">${c.titulo}</h2>
                            <div class="space-y-1.5 text-sm text-brand-textMuted">
                                <p><strong class="text-brand-textDark">Tipo:</strong> ${c.tipo.replace("_", " y ")}</p>
                                <p><strong class="text-brand-textDark">Lugar:</strong> ${c.ubicacion}</p>
                                <p><strong class="text-brand-textDark">Horario:</strong> ${c.horario}</p>
                                <p><strong class="text-brand-textDark">Requisitos:</strong> ${c.requisitos}</p>
                            </div>
                            ${turnoHTML}
                            ${linkOficialHTML}
                        </div>
                    `;
                }).join("");
            } catch (err) {
                grid.innerHTML = `<p class="text-sm text-red-600">Error: ${err.message}</p>`;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderNavbar("campanas");
            const sel = document.getElementById("campana-partido");
            populatePartidosSelect(sel, "Todos los partidos");
            sel.addEventListener("change", cargarCampanas);
            cargarCampanas();
        });
    </script>
</body>
</html>
