<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo y Perdidos - Huellitas Cerca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="js/config.js"></script>
    <script>tailwind.config = TAILWIND_BRAND_CONFIG;</script>
</head>
<body class="bg-brand-bg text-brand-textDark font-sans min-h-screen">

    <header id="app-header" class="bg-brand-bg border-b border-brand-tagBg sticky top-0 z-50"></header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- FILTROS -->
            <aside class="lg:col-span-3 bg-brand-card p-6 rounded-card border border-brand-tagBg h-fit space-y-5">
                <div class="flex items-center justify-between pb-3 border-b border-brand-tagBg">
                    <h2 class="font-bold text-sm uppercase tracking-wider text-brand-primary">Filtros de Búsqueda</h2>
                    <button id="btn-limpiar" class="text-xs font-semibold text-brand-accent hover:underline">Limpiar</button>
                </div>

                <div>
                    <label class="block text-xs font-bold text-brand-textMuted uppercase mb-2">Partido / Localidad</label>
                    <select id="filtro-partido" class="w-full px-4 py-2.5 bg-white border border-brand-tagBg rounded-pill text-sm"></select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-brand-textMuted uppercase mb-2">Tipo de Caso</label>
                    <select id="filtro-tipo" class="w-full px-4 py-2.5 bg-white border border-brand-tagBg rounded-pill text-sm">
                        <option value="">Todos (Adopción y Perdidos)</option>
                        <option value="ADOPCION">En Adopción</option>
                        <option value="PERDIDO">Perdidos</option>
                        <option value="ENCONTRADO">Encontrados en vía pública</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-brand-textMuted uppercase mb-2">Especie</label>
                    <select id="filtro-especie" class="w-full px-4 py-2.5 bg-white border border-brand-tagBg rounded-pill text-sm">
                        <option value="">Perros y Gatos</option>
                        <option value="PERRO">Perros</option>
                        <option value="GATO">Gatos</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-brand-textMuted uppercase mb-2">Tamaño</label>
                    <select id="filtro-tamano" class="w-full px-4 py-2.5 bg-white border border-brand-tagBg rounded-pill text-sm">
                        <option value="">Todos</option>
                        <option value="PEQUENO">Pequeño</option>
                        <option value="MEDIANO">Mediano</option>
                        <option value="GRANDE">Grande</option>
                    </select>
                </div>

                <label class="flex items-center gap-2 text-xs font-semibold text-brand-textDark cursor-pointer pt-2">
                    <input type="checkbox" id="filtro-verificados" class="rounded">
                    Solo respaldados por Municipio
                </label>
            </aside>

            <!-- RESULTADOS -->
            <section class="lg:col-span-9 space-y-6">
                <div class="flex flex-wrap justify-between items-center gap-2">
                    <h1 class="font-serif font-bold text-2xl md:text-3xl text-brand-textDark">Catálogo Unificado</h1>
                    <span id="contador-resultados" class="text-sm font-semibold text-brand-textMuted">Cargando...</span>
                </div>

                <div id="grid-mascotas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
            </section>
        </div>
    </main>

    <!-- MODAL FICHA TÉCNICA -->
    <div id="modal-ficha" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-brand-card rounded-card border border-brand-tagBg max-w-lg w-full p-6 space-y-4">
            <div class="flex justify-between items-start">
                <h3 id="modal-titulo" class="font-serif font-bold text-2xl text-brand-textDark"></h3>
                <button onclick="cerrarModal()" class="text-brand-textMuted hover:text-brand-textDark text-xl">&times;</button>
            </div>
            <img id="modal-img" src="" alt="" class="w-full h-56 object-cover rounded-card border border-brand-tagBg">
            <p id="modal-desc" class="text-sm text-brand-textMuted"></p>
            <div id="modal-salud" class="grid grid-cols-2 gap-2 text-xs"></div>
            <a id="modal-wa" href="#" target="_blank" class="w-full py-3 bg-brand-accent hover:bg-brand-accentHover text-white rounded-pill text-sm font-semibold flex justify-center items-center gap-2">
                <i class="fa-brands fa-whatsapp text-lg"></i> Contactar por WhatsApp &rarr;
            </a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let mascotasCache = [];

        function cerrarModal() {
            document.getElementById("modal-ficha").classList.add("hidden");
        }

        function abrirFicha(id) {
            const m = mascotasCache.find(item => item.id === id);
            if (!m) return;
            document.getElementById("modal-titulo").textContent = `${m.nombre} (${m.partido})`;
            document.getElementById("modal-img").src = m.foto_url;
            document.getElementById("modal-desc").textContent = m.descripcion;

            const badge = (ok, label) => `<div class="px-3 py-2 rounded-pill border border-brand-tagBg ${ok ? 'bg-brand-greenBadge/15 text-brand-greenBadge font-bold' : 'text-brand-textMuted'}">${ok ? '✓' : '•'} ${label}</div>`;
            document.getElementById("modal-salud").innerHTML =
                badge(m.salud?.vacunado, "Vacunado") +
                badge(m.salud?.antirrabica, "Antirrábica") +
                badge(m.salud?.esterilizado, "Esterilizado") +
                badge(m.salud?.desparasitado, "Desparasitado");

            const textoWa = m.tipo_publicacion === "ADOPCION"
                ? `Hola! Vi a ${m.nombre} en ${CONFIG.APP_NAME} (${m.partido}) y me gustaría postularme para adoptarlo.`
                : `Hola! Vi el reporte de ${m.nombre} (${m.tipo_publicacion}) en ${CONFIG.APP_NAME} - ${m.partido} y tengo información.`;
            document.getElementById("modal-wa").href = `https://wa.me/${m.whatsapp_contacto}?text=${encodeURIComponent(textoWa)}`;
            document.getElementById("modal-ficha").classList.remove("hidden");
        }

        async function cargarCatalogo() {
            const params = new URLSearchParams();
            const partido = document.getElementById("filtro-partido").value;
            const tipo = document.getElementById("filtro-tipo").value;
            const especie = document.getElementById("filtro-especie").value;
            const tamano = document.getElementById("filtro-tamano").value;
            const soloVerif = document.getElementById("filtro-verificados").checked;

            if (partido) params.append("partido", partido);
            if (tipo) params.append("tipo_publicacion", tipo);
            if (especie) params.append("especie", especie);
            if (tamano) params.append("tamano", tamano);
            if (soloVerif) params.append("solo_verificados", "true");

            const grid = document.getElementById("grid-mascotas");
            grid.innerHTML = `<p class="text-sm text-brand-textMuted col-span-full">Buscando publicaciones...</p>`;

            try {
                mascotasCache = await apiFetch(`/mascotas?${params.toString()}`);
                document.getElementById("contador-resultados").textContent = `${mascotasCache.length} publicaciones activas`;

                if (mascotasCache.length === 0) {
                    grid.innerHTML = `<div class="col-span-full bg-brand-card p-8 rounded-card border border-brand-tagBg text-center text-sm text-brand-textMuted">No hay mascotas con esos filtros en este momento.</div>`;
                    return;
                }

                grid.innerHTML = mascotasCache.map(m => {
                    const tipoColor = m.tipo_publicacion === "ADOPCION" ? "bg-brand-primary" : "bg-brand-accent";
                    const sello = m.verificado_municipio
                        ? `<span class="inline-block px-2.5 py-0.5 rounded-pill bg-brand-greenBadge text-white text-[10px] font-bold">Respaldado por Municipio</span>`
                        : `<span class="inline-block px-2.5 py-0.5 rounded-pill bg-brand-tagBg text-brand-textMuted text-[10px] font-semibold">Refugio / Comunitario</span>`;

                    return `
                        <div class="bg-brand-card rounded-card p-4 border border-brand-tagBg flex flex-col justify-between">
                            <div>
                                <div class="relative h-48 rounded-card overflow-hidden mb-3 border border-brand-tagBg">
                                    <img src="${m.foto_url}" alt="${m.nombre}" class="w-full h-full object-cover">
                                    <span class="absolute top-3 left-3 ${tipoColor} text-white text-[10px] px-3 py-1 rounded-pill font-bold uppercase">${m.tipo_publicacion}</span>
                                    <span class="absolute top-3 right-3 bg-brand-textDark/80 text-white text-[10px] px-3 py-1 rounded-pill font-bold">${m.especie}</span>
                                </div>
                                <div class="mb-2">${sello}</div>
                                <h3 class="font-serif font-bold text-xl text-brand-textDark">${m.nombre}</h3>
                                <p class="text-xs font-semibold text-brand-primary mt-0.5">${m.partido} &bull; ${m.zona_barrio}</p>
                                <p class="text-xs text-brand-textMuted mt-1 mb-4">${m.sexo} &bull; ${m.edad} &bull; ${m.tamano}</p>
                            </div>
                            <button onclick="abrirFicha('${m.id}')" class="w-full py-2.5 bg-brand-accent hover:bg-brand-accentHover text-white rounded-pill text-xs font-semibold transition-colors">
                                Ver ficha y contactar &rarr;
                            </button>
                        </div>
                    `;
                }).join("");
            } catch (err) {
                grid.innerHTML = `<p class="text-sm text-red-600 col-span-full">Error: ${err.message}</p>`;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderNavbar("catalogo");
            const selPartido = document.getElementById("filtro-partido");
            populatePartidosSelect(selPartido, "Todos los partidos");

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("tipo")) {
                document.getElementById("filtro-tipo").value = urlParams.get("tipo");
            }
            if (urlParams.get("partido")) {
                selPartido.value = urlParams.get("partido");
            }

            ["filtro-partido", "filtro-tipo", "filtro-especie", "filtro-tamano", "filtro-verificados"].forEach(id => {
                document.getElementById(id).addEventListener("change", cargarCatalogo);
            });

            document.getElementById("btn-limpiar").addEventListener("click", () => {
                selPartido.value = "";
                document.getElementById("filtro-tipo").value = "";
                document.getElementById("filtro-especie").value = "";
                document.getElementById("filtro-tamano").value = "";
                document.getElementById("filtro-verificados").checked = false;
                cargarCatalogo();
            });

            cargarCatalogo();
        });
    </script>
</body>
</html>
